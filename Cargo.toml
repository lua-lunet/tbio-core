[package]
name = "tbio-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
links = "tbio"
build = "build.rs"

description = "Safe Rust binding over the vendored TigerBeetle durable-IO strip: the AOF (append-only write-behind log) and the lifecycle marker store over the superblock quorum-of-copies construction, Zig C ABI"
license = "Apache-2.0"

[lib]
name = "tbio"
crate-type = ["rlib"]

[dependencies]

[features]
# Link the Zig store statically instead of through the cdylib (the
# advisory-lock adapter opts in: its own cdylib is loaded by the Lua
# runtime and must stay self-contained).
static = []

[dev-dependencies]
serde_json = "1"
